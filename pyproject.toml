[project]
name = "r2g-arango"
version = "0.9.0"
description = "Project relational and structured data sources as a graph in ArangoDB."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Arthur Keen", email = "aakeen@yahoo.com" },
]
maintainers = [
    { name = "Arthur Keen", email = "aakeen@yahoo.com" },
]
keywords = [
    "arangodb",
    "etl",
    "graph",
    "graph-database",
    "postgresql",
    "mysql",
    "mariadb",
    "sqlserver",
    "snowflake",
    "cdc",
    "kafka",
    "data-catalog",
    "openmetadata",
    "relational-to-graph",
    "data-pipeline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Upper bounds track the next major version (next minor for 0.x packages
# that follow semver loosely) to avoid silent breaking upgrades.
dependencies = [
    "typer[all]>=0.15.0,<1.0",
    "python-arango>=7.5.0,<9.0",
    "pydantic>=2.5.0,<3.0",
    "rich>=13.0.0,<16.0",
    "polars>=1.0.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "structlog>=24.1.0,<26.0",
    "python-dotenv>=1.0.0,<2.0",
    "cryptography>=42.0.0,<49.0",
    # CSI v1 interchange emitter (src/r2g/csi.py) validates its output against the
    # vendored JSON Schema. Also a transitive RSA dep; declared here since r2g
    # imports it directly.
    "jsonschema>=4.0,<5.0",
    # Shared physical-schema type core. r2g's `types.Schema/Table/Column` are
    # re-based on RSA's `PhysicalSchema/Table/Column` (see
    # docs/internal/DESIGN-rsa-compat-layer.md), so RSA is now a core runtime
    # dependency. Primarily RSA's lightweight core (pydantic types, FK-inference
    # engine, source-type helpers) is used here; its heavy connector/owl/mcp
    # features remain its own optional extras. Floor is 0.4.0: that release adds
    # the `extra` consumer-metadata passthrough (0.2.0), physical-model enrichment
    # (0.3.0), and the dbt/OSI data-catalog connectors (0.4.0) r2g builds on, and
    # it is what the test suite (incl. the introspection parity audit) validates
    # against.
    # 0.8.0 adds the bitemporal stamps (transaction_time / valid_from /
    # valid_time_source / predecessor_fingerprint on PhysicalSchema and Table)
    # that `export-csi` forwards onto CSI provenance. Raised 2026-09-14; the
    # 0.7 band excluded the very release that carried them.
    # 0.9.0 reports constraint-less unique indexes as UNIQUE keys (Plan A A3a)
    # and adds PK profiling and draft key overlays (A4, A5). A minor bump, not a
    # patch, because it changes introspection output -- so this band moves on
    # purpose rather than silently. Raised 2026-10-02.
    # 0.9.5 makes the Postgres sampler governable (budget, timeout, query tag,
    # stats), which `source suggest-keys` needs to accept PostgreSQL sources.
    # 0.10.0 carries the shared singularizer rules and the known-answer list r2g's
    # tests check its own copy against (r2g-arango#30), and reads declared CHECK
    # value lists on Postgres/MySQL/SQL Server (the schema fingerprint moves for
    # schemas with one). Raised 2026-10-21.
    # 0.11.0 adds the dictionary layer (a vendored noun lexicon) that r2g's own
    # singularizer reads, and the extended known answers (r2g-arango#30). Raised 2026-10-26.
    "relational-schema-analyzer>=0.11.0,<0.12.0",
]

# Optional extras let users install only what they need:
#   pipx install r2g-arango[postgres,ui]   # interactive mapping studio against PG
#   pip  install r2g-arango[kafka]         # headless Kafka CDC worker
#   pip  install r2g-arango[all]           # everything (postgres + snowflake + kafka + ui + mcp)
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1.0,<4.0"]
mysql = ["pymysql>=1.1.0,<2.0"]
sqlserver = ["pymssql>=2.2.0,<3.0"]
# Floor at 3.12: earlier releases hard-pin pyarrow==10.0.1, which has no cp312
# wheel and fails to build from sdist on Python 3.12. 3.12+ loosen that pin and
# ship cp312 wheels.
snowflake = ["snowflake-connector-python>=3.12,<4.0"]
clickhouse = ["clickhouse-connect>=0.7,<1.0"]
kafka = ["confluent-kafka>=2.3.0,<3.0"]
ui = ["fastapi>=0.110.0,<1.0", "uvicorn[standard]>=0.27.0,<1.0", "httpx>=0.27.0,<1.0"]
mcp = ["mcp[cli]>=1.20.0,<2.0"]
openmetadata = ["httpx>=0.27.0,<1.0"]
llm = ["httpx>=0.27.0,<1.0"]
# Deterministic conceptual-model / ontology derivation via the shared
# relational-schema-analyzer library. Kept as an empty back-compat alias: RSA is
# now a core dependency (see [project].dependencies), so `r2g-arango[ontology]`
# resolves to the same install. Remove after one release.
ontology = []
all = ["r2g-arango[postgres,mysql,sqlserver,snowflake,clickhouse,kafka,ui,mcp,openmetadata,llm,ontology]"]
# fakesnow (an in-process Snowflake emulator) is here, not only in dev: CI's test
# job installs [all,test], and tests/test_cli_suggest_keys.py skips without it.
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "rdflib>=7.0,<8.0",
  "fakesnow>=0.11",
  # The singularizer cross-check (tests/test_naming_known_answers.py) tests ASA's copy
  # too; without ASA here it would skip in CI's test job (r2g-arango#30).
  "arangodb-schema-analyzer>=0.18.0",
]
dev = [
  "ruff>=0.4",
  "mypy>=1.10",
  # Present so tests/test_csi.py::test_vendored_csi_schema_matches_installed_analyzer
  # runs in CI: the vendored CSI schema must not drift from the analyzer's
  # authoritative copy (contextual-data-fabric unified-architecture paper, step 2).
  "arangodb-schema-analyzer>=0.18.0",
  # In-process Snowflake emulator, so tests/test_cli_suggest_keys.py runs the
  # suggest -> review -> snapshot loop end to end in CI without an account.
  "fakesnow>=0.11",
]

[project.urls]
Homepage = "https://github.com/ArthurKeen/r2g-arango"
Repository = "https://github.com/ArthurKeen/r2g-arango"
Issues = "https://github.com/ArthurKeen/r2g-arango/issues"
Changelog = "https://github.com/ArthurKeen/r2g-arango/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ArthurKeen/r2g-arango/tree/main/docs"

[project.scripts]
r2g = "r2g.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
r2g = [
  "ui/static/*",
  "ui/static/**/*",
  "schemas/*.json",
  "demo/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live PostgreSQL and ArangoDB (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["r2g"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/r2g/generators/visualizer.py" = ["E501"]
